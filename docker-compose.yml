services:
  redis:
    image: 'redis:7-alpine' # Use a lightweight Redis image
    container_name: advayagithub-redis-1
    ports:
      - '6379:6379' # Map host port 6379 to container port 6379
    command: redis-server --appendonly yes # Enable AOF persistence for Redis
    volumes:
      - redis-data:/data # Mount a named volume for Redis data persistence
    healthcheck: # Health check for Redis
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Timeout after 5 seconds
      retries: 5 # Retry 5 times before marking as unhealthy
      start_period: 10s # Give Redis 10 seconds to start up before checking

  mongo:
    image: 'mongo:latest' # Use the latest MongoDB image
    container_name: advayagithub-mongo-1
    ports:
      - '27017:27017' # Map host port 27017 to container port 27017
    volumes:
      - mongo-data:/data/db # Mount a named volume for MongoDB data persistence
    healthcheck: # Health check for MongoDB
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./hackathon-backend # Path to your backend directory containing Dockerfile
    container_name: advayagithub-backend-1
    ports:
      - '5000:5000' # Map host port 5000 to container port 5000
    env_file: # Load environment variables from the .env file in the hackathon-backend directory
      - ./hackathon-backend/.env
    environment:
      REDIS_HOST: redis # Override REDIS_HOST to use the service name 'redis'
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/hackathon # Connect to the mongo service
      PORT: 5000 # Ensure the port is set for the app inside the container
      NODE_ENV: development # Set Node.js environment to development for local testing
      HACKATHON_DEADLINE: "2026-04-02T09:00:00" # Example: Set your deadline here or in .env
    depends_on:
      - redis
      - mongo
    healthcheck: # Health check for the Backend API
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Timeout after 5 seconds
      retries: 5 # Retry 5 times before marking as unhealthy
      start_period: 40s # Increased start_period for backend (gives more time for MongoDB)
    command: node server.js # Command to run the backend server

  worker:
    build:
      context: ./hackathon-backend # Path to your backend directory containing Dockerfile
    container_name: advayagithub-worker-1
    env_file: # Load environment variables from the .env file in the hackathon-backend directory
      - ./hackathon-backend/.env
    environment:
      REDIS_HOST: redis # Override REDIS_HOST to use the service name 'redis'
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/hackathon # Connect to the mongo service
      NODE_ENV: development # Set Node.js environment to development for local testing
      HACKATHON_DEADLINE: "2026-04-02T09:00:00" # Example: Set your deadline here or in .env
    depends_on:
      - redis
      - backend
      - mongo
    command: node worker.js # Command to run the worker process 
    healthcheck: # Health check for the Worker
      test: ["CMD-SHELL", "node /app/healthcheck-worker.js"]
      interval: 15s # Check every 15 seconds
      timeout: 15s # Timeout after 15 seconds (increased from 10s)
      retries: 5 # Retry 5 times (increased from 3)
      start_period: 60s # Give the worker 60 seconds to connect to its dependencies (increased from 45s)

volumes:
  redis-data: # Named volume for Redis persistence
  mongo-data: # Named volume for MongoDB persistence